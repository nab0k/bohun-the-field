<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isometric objects: options</title>
<!-- Dev-only comparison sheet (09.10.2026): three styles of our own vector isometric map objects to replace the Kenney 3D models. -->
<style>
  :root { --bg: #d9d2b4; --ink: #22201a; --muted: #6b6650; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font: 800 20px/1.2 ui-monospace, monospace; letter-spacing: .04em; margin: 0 0 6px; }
  p.lead { margin: 0 0 22px; color: var(--muted); max-width: 760px; }
  section { margin: 0 0 26px; padding: 16px; border-radius: 6px; }
  section h2 { font: 800 15px/1.2 ui-monospace, monospace; margin: 0 0 4px; letter-spacing: .05em; }
  section p { margin: 0 0 12px; color: inherit; opacity: .75; max-width: 820px; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; text-align: center; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font: 600 11px/1.2 ui-monospace, monospace; letter-spacing: .06em; opacity: .7; margin-top: 2px; }
  .map { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M0 40 L40 0' stroke='%23c9c09c' stroke-width='1'/></svg>"), #e3dcbd; }
  .dark { background: #141810; color: #e8e3c8; }
  .small { display: flex; gap: 18px; align-items: end; margin-top: 12px; flex-wrap: wrap; }
  .small svg { width: 44px; height: auto; }
  .small span { font: 600 11px ui-monospace, monospace; opacity: .7; align-self: center; }
</style>
</head>
<body>
<main>
  <h1>ISOMETRIC MAP OBJECTS · 3 STYLE OPTIONS</h1>
  <p class="lead">Our own vector drawings (SVG): one style for all objects, sharp at any size, light to load, no licence questions. Same six objects in each option. Below each row: the size they will have on the map.</p>
  <div id="out"></div>
</main>
<script>
// isometric projection: x to the right-down, y to the left-down, z up
const C = Math.cos(Math.PI / 6), S = 0.5;
const P = (x, y, z) => [(x - y) * C, (x + y) * S - z];
const poly = (pts, fill, st) => `<polygon points="${pts.map((p) => P(...p).map((v) => v.toFixed(1)).join(',')).join(' ')}" fill="${fill}"${st ? ` stroke="${st.c}" stroke-width="${st.w}" stroke-linejoin="round"` : ''}/>`;
// a box at (x,y,z) with size w (x), d (y), h (z): top, left (y side), right (x side)
function box(x, y, z, w, d, h, t, st) {
  return poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], t.l, st) +
    poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], t.r, st) +
    poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], t.t, st);
}
// a gable/saw roof prism along x
function prism(x, y, z, w, d, h, t, st) {
  return poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d / 2, z + h], [x, y + d / 2, z + h]], t.t, st) +
    poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d / 2, z + h]], t.r, st);
}
const shadow = (w, d, c) => poly([[-2, -2, 0], [w + 4, -2, 0], [w + 4, d + 4, 0], [-2, d + 4, 0]], c);

const OBJECTS = {
  FACTORY: (t, a, st) => shadow(46, 30, t.sh) + box(0, 0, 0, 40, 26, 14, t, st) + prism(0, 0, 14, 13, 26, 8, t, st) + prism(13, 0, 14, 13, 26, 8, t, st) + prism(26, 0, 14, 14, 26, 8, t, st) + box(32, 3, 22, 5, 5, 18, t, st) + box(32, 3, 40, 5, 5, 2, a, st),
  PORT: (t, a, st) => shadow(50, 30, t.sh) + box(0, 0, 0, 46, 26, 4, t, st) + box(4, 14, 4, 10, 8, 7, a, st) + box(16, 14, 4, 10, 8, 7, t, st) + box(4, 14, 11, 10, 8, 6, t, st) + box(30, 4, 4, 3, 3, 30, t, st) + box(20, 4, 34, 22, 3, 3, a, st) + box(40, 4, 22, 2, 2, 12, t, st),
  WAREHOUSE: (t, a, st) => shadow(50, 28, t.sh) + box(0, 0, 0, 46, 24, 10, t, st) + prism(0, 0, 10, 46, 24, 6, t, st) + box(46, 4, 0, 1, 5, 6, a, st) + box(46, 12, 0, 1, 5, 6, a, st),
  'BANK / FUND': (t, a, st) => shadow(36, 30, t.sh) + box(0, 0, 0, 32, 26, 3, t, st) + [3, 10, 17, 24].map((x) => box(x + 1, 22, 3, 3, 3, 14, t, st)).join('') + box(2, 2, 3, 28, 20, 14, t, st) + box(0, 0, 17, 32, 26, 3, t, st) + prism(0, 0, 20, 32, 26, 9, a, st),
  'LAB / R&D': (t, a, st) => shadow(36, 30, t.sh) + box(0, 0, 0, 32, 26, 12, t, st) + box(8, 6, 12, 14, 14, 6, t, st) + `<ellipse cx="${P(15, 13, 18)[0]}" cy="${P(15, 13, 18)[1] - 3}" rx="11" ry="9" fill="${a.t}"${st ? ` stroke="${st.c}" stroke-width="${st.w}"` : ''}/>` + box(26, 18, 12, 3, 3, 10, t, st),
  'HQ / OFFICE': (t, a, st) => shadow(30, 30, t.sh) + box(0, 0, 0, 26, 26, 8, t, st) + box(4, 4, 8, 18, 18, 34, t, st) + box(4, 4, 42, 18, 18, 2, a, st) + [14, 22, 30].map((z) => box(4, 22, z, 18, 0.01, 1.4, a)).join(''),
};
const STYLES = [
  { id: 'A', name: 'A · DRAFTSMAN LINE', note: 'Light faces, fine graphite outline, one gold accent per object. Reads like an architect\'s drawing; calm on the relief map.', cls: 'map',
    t: { t: '#f6f1df', l: '#e2dac0', r: '#cfc5a6', sh: '#00000014' }, a: { t: '#e2b84a', l: '#c99a2e', r: '#b1861f' }, st: { c: '#3a352a', w: 0.9 } },
  { id: 'B', name: 'B · SOFT COLOUR', note: 'Flat faces in three tones of one colour, no outline. Modern and friendly; each object type can get its own colour (factory, port, finance…).', cls: 'map',
    t: { t: '#cfd6c4', l: '#a9b59c', r: '#8c9a80', sh: '#00000018' }, a: { t: '#e9c46a', l: '#d4a843', r: '#b88e2c' }, st: null },
  { id: 'C', name: 'C · DARK BRAND', note: 'Dark graphite faces with gold edges; matches the site\'s dark panels and the Night mode.', cls: 'dark',
    t: { t: '#3a3f33', l: '#2a2e25', r: '#1f221b', sh: '#00000040' }, a: { t: '#e2b84a', l: '#b58f2c', r: '#8f7020' }, st: { c: '#d9b75a', w: 0.7 } },
];
const svg = (inner, size) => `<svg viewBox="-55 -62 110 92" ${size ? `width="${size}"` : ''} xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
let html = '';
for (const s of STYLES) {
  html += `<section class="${s.cls}"><h2>${s.name}</h2><p>${s.note}</p><div class="row">`;
  for (const [name, f] of Object.entries(OBJECTS)) html += `<figure>${svg(f(s.t, s.a, s.st))}<figcaption>${name}</figcaption></figure>`;
  html += `</div><div class="small"><span>ON THE MAP →</span>${Object.values(OBJECTS).map((f) => svg(f(s.t, s.a, s.st))).join('')}</div></section>`;
}
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
