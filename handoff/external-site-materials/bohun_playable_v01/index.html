<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOHUN / THE FIELD</title><style>*{box-sizing:border-box}body{margin:0;background:#101a1a;color:#eee;font:15px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#172322}strong{letter-spacing:.15em}button{background:#293b36;color:#fff;border:1px solid #83917a;padding:9px 13px;border-radius:5px;cursor:pointer}button.active{background:#8e713e}#stage{position:relative;height:calc(100vh - 105px);min-height:420px;overflow:hidden;cursor:grab}canvas{width:100%;height:100%;display:block}#info{padding:8px 18px;background:#172322;color:#c7d4cb}small{color:#b8c5b9}#hint{position:absolute;bottom:14px;left:14px;background:#14231fdd;padding:10px;border-radius:5px;pointer-events:none}</style><header><strong>BOHUN / THE FIELD</strong><button id="world">WORLD</button><button id="field" class="active">UKRAINE</button><button id="reset">Вся карта</button><button id="cargo">Отправить груз: Львов → Киев</button><button id="unlock">Исследовать: Варшава</button><small id="status">Демо: выбери город</small></header><div id="stage"><canvas id="c"></canvas><div id="hint">Колесо: масштаб · Перетаскивание: карта · Клик: выбрать город</div></div><div id="info">Техническая демосцена. Позиции маркеров предварительные, художественный фон ещё не привязан к геометрии.</div><script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');const images={};for(const [k,f] of Object.entries({world:'world.jpg',field:'field.jpg',truck:'truck.png'})){const i=new Image();i.src='assets/'+f;images[k]=i;}let mode='field',zoom=1,ox=0,oy=0,drag=false,moved=false,last=[0,0],cargo=null,unlocked=false;const points={field:[['Варшава',.29,.39],['Львов',.37,.49],['Киев',.58,.44],['Одесса',.55,.74]],world:[['США',.22,.36],['Европа',.51,.31],['Украина',.56,.34],['Китай',.76,.4]]};function dims(){let r=stage.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio)}function view(){let im=images[mode],w=im.naturalWidth||2560,h=im.naturalHeight||1600;let fit=Math.min(canvas.width/w,canvas.height/h);return {w,h,s:fit*zoom,x:(canvas.width-w*fit*zoom)/2+ox,y:(canvas.height-h*fit*zoom)/2+oy}}function at(p,v){return [v.x+p[1]*v.w*v.s,v.y+p[2]*v.h*v.s]}function line(a,b,v,dash=false){let A=at(a,v),B=at(b,v);ctx.beginPath();ctx.setLineDash(dash?[12,10]:[]);ctx.moveTo(...A);ctx.lineTo(...B);ctx.strokeStyle='#ffe6a1';ctx.lineWidth=3*devicePixelRatio;ctx.stroke();ctx.setLineDash([])}function draw(t){let v=view(),im=images[mode];ctx.clearRect(0,0,canvas.width,canvas.height);if(im.complete&&im.naturalWidth)ctx.drawImage(im,v.x,v.y,v.w*v.s,v.h*v.s);let ps=points[mode];if(mode==='field'){line(ps[1],ps[2],v);if(unlocked)line(ps[1],ps[0],v,true)}for(let p of ps){let [x,y]=at(p,v);ctx.beginPath();ctx.arc(x,y,7*devicePixelRatio,0,Math.PI*2);ctx.fillStyle='#ffdc7c';ctx.fill();ctx.strokeStyle='#273128';ctx.lineWidth=3*devicePixelRatio;ctx.stroke();ctx.font=`bold ${14*devicePixelRatio}px system-ui`;ctx.textAlign='center';ctx.strokeStyle='#101b17';ctx.lineWidth=5*devicePixelRatio;ctx.strokeText(p[0],x,y-16*devicePixelRatio);ctx.fillStyle='white';ctx.fillText(p[0],x,y-16*devicePixelRatio)}if(cargo&&mode==='field'){let q=Math.min(1,(t-cargo)/4300),A=at(ps[1],v),B=at(ps[2],v),x=A[0]+(B[0]-A[0])*q,y=A[1]+(B[1]-A[1])*q;let truck=images.truck;if(truck.complete&&truck.naturalWidth)ctx.drawImage(truck,x-24*devicePixelRatio,y-25*devicePixelRatio,48*devicePixelRatio,48*devicePixelRatio);else {ctx.fillStyle='#ffe1a0';ctx.fillRect(x-10,y-10,20,20)}if(q===1){cargo=null;document.querySelector('#status').textContent='Груз доставлен в Киев'}}requestAnimationFrame(draw)}function selectMode(m){mode=m;zoom=1;ox=oy=0;document.querySelector('#world').classList.toggle('active',m==='world');document.querySelector('#field').classList.toggle('active',m==='field')}document.querySelector('#world').onclick=()=>selectMode('world');document.querySelector('#field').onclick=()=>selectMode('field');document.querySelector('#reset').onclick=()=>{zoom=1;ox=oy=0};document.querySelector('#cargo').onclick=()=>{selectMode('field');cargo=performance.now();document.querySelector('#status').textContent='Повозка в пути'};document.querySelector('#unlock').onclick=()=>{selectMode('field');unlocked=true;document.querySelector('#status').textContent='Маршрут Львов → Варшава открыт'};canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-last[0],dy=e.clientY-last[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;ox+=dx*devicePixelRatio;oy+=dy*devicePixelRatio;last=[e.clientX,e.clientY]});canvas.addEventListener('pointerup',e=>{drag=false;if(moved)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*devicePixelRatio,y=(e.clientY-r.top)*devicePixelRatio,v=view();let p=points[mode].find(p=>{let a=at(p,v);return Math.hypot(a[0]-x,a[1]-y)<28*devicePixelRatio});if(p)document.querySelector('#status').textContent='Выбрано: '+p[0]});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(5,zoom*(e.deltaY>0?.9:1.1)))},{passive:false});window.addEventListener('resize',dims);dims();requestAnimationFrame(draw);
</script></html>
