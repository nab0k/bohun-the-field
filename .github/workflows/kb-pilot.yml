name: CAPACITY FActScore native import (isolated)
run-name: CAPACITY FActScore native import
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed trial commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: capacity-factscore-native-20261104
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'nab0k/bohun-the-field' && github.actor == 'nab0k' && github.run_attempt == 1 && github.ref == 'refs/heads/codex/capacity-factscore-native-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - name: Verify exact reviewed trial commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          test "${#EXPECTED_SHA}" -eq 40
          case "$EXPECTED_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Resolve CPU wheels and install in a temporary venv
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/factscore-native"
          mkdir -m 700 "$root" "$root/torch" "$root/wheels"
          python -m venv "$root/venv"
          py="$root/venv/bin/python"
          "$py" -m pip --isolated download --timeout 25 --retries 0 \
            --only-binary=:all: --no-deps --index-url https://download.pytorch.org/whl/cpu \
            --dest "$root/torch" 'torch==1.13.1+cpu'
          wheels=("$root"/torch/torch-1.13.1+cpu-cp310-*-linux_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          "$py" -m pip --isolated download --timeout 25 --retries 0 \
            --only-binary=:all: --index-url https://pypi.org/simple --dest "$root/wheels" \
            "${wheels[0]}" 'numpy==1.24.4' 'transformers==4.29.2' \
            'openai==0.27.10' 'spacy==3.5.4' 'thinc==8.1.12' 'blis==0.7.11' \
            'pydantic==1.10.15' 'nltk==3.8.1' 'rank-bm25==0.2.2' 'tqdm==4.66.6' \
            'huggingface-hub==0.16.4' 'tokenizers==0.13.3' 'sentencepiece==0.1.99'
          (
            cd "$root/wheels"
            sha256sum -- *.whl | tee "$root/wheel-sha256.txt"
            grep -Fx '7bd4a95571adadfc271746fa146a4bcfd89c0cf731e49c3d1ad863290adbe8ae  rank_bm25-0.2.2-py3-none-any.whl' "$root/wheel-sha256.txt"
          )
          "$py" -m pip --isolated install --no-index --no-deps "$root"/wheels/*.whl
          "$py" -m pip check
      - name: Download and verify the pinned upstream source
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/factscore-native/upstream.tar.gz"
          curl --fail --silent --show-error --proto '=https' --max-time 40 --max-filesize 100000 \
            https://codeload.github.com/shmsw25/FActScore/tar.gz/f28272deffcf33efc1f1117d5479c10bb75221a9 -o "$archive"
          printf '%s  %s\n' dcc1c9139b6f54ef3d946dc1bbc58b0080092fcbab023890a0728fd17e0eaa4f "$archive" | sha256sum -c -
      - name: Normal upstream imports and simulated verdicts
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/factscore-native"
          "$root/venv/bin/python" -I scripts/capacity-factscore/native_import.py "$root/upstream.tar.gz" | tee "$root/result.json"
