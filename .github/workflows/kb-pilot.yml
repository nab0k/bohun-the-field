name: BOHUN knowledge-base pilot (manual, EXP-028)
run-name: kb-pilot ${{ inputs.day_from }}..${{ inputs.day_to }} limit ${{ inputs.limit }}
on:
  workflow_dispatch:
    inputs:
      day_from:
        description: First publication day (YYYY-MM-DD)
        type: string
        required: true
      day_to:
        description: Last publication day (YYYY-MM-DD)
        type: string
        required: true
      limit:
        description: First N news items only (0 = all)
        type: string
        required: false
        default: '1'
      schema_mode:
        description: schema = JSON schema with search; text = JSON asked in the prompt
        type: choice
        options: [schema, text]
        default: text
      source:
        description: events = items that reached the old writer; items = every item with a body
        type: choice
        options: [events, items]
        default: events
      batch:
        description: Each model phase as one Gemini Batch request (half price, may wait)
        type: boolean
        default: false
      dossier_write:
        description: Save verified rows to the programme dossier (knowledge v16)
        type: boolean
        default: true
      mode:
        description: pilot = the run; probe = one neutral grounded question, structure only
        type: choice
        options: [pilot, embed, probe, probe-cloudflare, probe-free]
        default: pilot
      research_thinking:
        description: Thinking level of the research (search) step
        type: choice
        options: [low, medium, high]
        default: medium
      expected_sha:
        description: Exact reviewed main commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bohun-kb-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'nab0k/bohun-the-field' && github.actor == 'nab0k' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify reviewed revision before credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "${#EXPECTED_SHA}" -eq 40
          case "$EXPECTED_SHA" in *[!0-9a-f]*) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Offline pilot tests
        run: python -B -m unittest tests/kb_pilot/test_pilot.py
      - name: Temporary pinned PostgreSQL driver
        run: |
          python -m venv "$RUNNER_TEMP/bohun-kb"
          "$RUNNER_TEMP/bohun-kb/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
      - name: Spare embedding model (bge-m3 on CPU, embed mode only)
        if: inputs.mode == 'embed'
        run: |
          "$RUNNER_TEMP/bohun-kb/bin/python" -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          "$RUNNER_TEMP/bohun-kb/bin/python" -m pip install --disable-pip-version-check 'sentence-transformers==3.4.1'
      - name: Cache the spare embedding model
        if: inputs.mode == 'embed'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1
      - name: Run the pilot (writes only the dossier tables; cap $2 per run)
        env:
          DAY_FROM: ${{ inputs.day_from }}
          DAY_TO: ${{ inputs.day_to }}
          LIMIT: ${{ inputs.limit }}
          SCHEMA_MODE: ${{ inputs.schema_mode }}
          KB_RESEARCH_THINKING: ${{ inputs.research_thinking }}
          KB_MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          BATCH: ${{ inputs.batch && '--batch' || '' }}
          NO_DOSSIER: ${{ (!inputs.dossier_write) && '--no-dossier-write' || '' }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free model (Workers AI); absent secrets = every step on Gemini.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          # Further free providers (D-20261029-EXP028 A13); absent = not used.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot --day-from "$DAY_FROM" --day-to "$DAY_TO" --limit "${LIMIT:-0}" --schema-mode "$SCHEMA_MODE" --source "$SOURCE" $BATCH $NO_DOSSIER --out "$RUNNER_TEMP/kb-pilot-out"'
      - name: Keep the result for review
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kb-pilot-result
          path: ${{ runner.temp }}/kb-pilot-out
          retention-days: 14
          if-no-files-found: warn
