name: BOHUN knowledge-base pilot (manual, EXP-028)
run-name: C4-11 signal method backtest
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed checkout SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  trial:
    if: github.run_attempt == '1' && github.sha == inputs.approved_head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Read-only backtest
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
          python -B scripts/signals-backtest/run.py "$RUNNER_TEMP/backtest.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backtest-result
          path: ${{ runner.temp }}/backtest.json
          if-no-files-found: ignore
          retention-days: 1
