name: D2RC cloud probe
on:
  workflow_dispatch:
    inputs:
      day_from:
        description: First publication day (YYYY-MM-DD)
        type: string
        required: true
      day_to:
        description: Last publication day (YYYY-MM-DD)
        type: string
        required: true
      limit:
        description: First N news items only (0 = all)
        type: string
        required: false
        default: '1'
      schema_mode:
        description: schema = JSON schema with search; text = JSON asked in the prompt
        type: choice
        options: [schema, text]
        default: text
      source:
        description: events = items that reached the old writer; items = every item with a body
        type: choice
        options: [events, items]
        default: events
      batch:
        description: Each model phase as one Gemini Batch request (half price, may wait)
        type: boolean
        default: false
      dossier_write:
        description: Save verified rows to the programme dossier (knowledge v16)
        type: boolean
        default: true
      mode:
        description: pilot = the run; pilot-publish = the run + CANDIDATEs held in the feed tables; admit = automatic admission of held syntheses (limit = max published, dossier_write off = dry run); extract = relations from every item (free models only); fulltext = publisher pages for items without text (measurement, no write); probe = one neutral grounded question
        type: choice
        options: [pilot, pilot-publish, admit, embed, extract, fulltext, probe, probe-cloudflare, probe-free]
        default: pilot
      research_thinking:
        description: Thinking level of the research (search) step
        type: choice
        options: [low, medium, high]
        default: medium
      expected_sha:
        description: Exact reviewed main commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bohun-d2rc-cloud-probe
  cancel-in-progress: false
jobs:
  trial:
    if: >-
      github.repository == 'nab0k/bohun-the-field' && github.actor == 'nab0k' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/codex/d2rc-cloud-probe' &&
      github.sha == inputs.expected_sha &&
      inputs.mode == 'admit' && inputs.dossier_write == false &&
      inputs.batch == false && inputs.limit == '1' &&
      inputs.day_from == '2023-04-04' && inputs.day_to == '2024-03-07'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned database driver
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
      - name: Start isolated PostgreSQL and simulate outage
        env:
          PYTHONPATH: .
          D2RC_PHASE: outage
        run: |
          pg=$(pg_config --bindir)
          cluster=$(mktemp -d "$RUNNER_TEMP/d2rc.XXXXXXXX")
          "$pg/initdb" -D "$cluster/data" -A trust --no-locale -E UTF8 >/dev/null
          "$pg/pg_ctl" -D "$cluster/data" -l "$cluster/server.log" -o "-c listen_addresses= -k $cluster -p 55432" -w start
          echo "D2RC_SOCKET=$cluster" >> "$GITHUB_ENV"
          D2RC_SOCKET="$cluster" python -B scripts/d2rc_cloud_probe.py
      - name: Simulate short 429 and verify cooldown after restart
        env:
          PYTHONPATH: .
          PGHOST: ${{ env.D2RC_SOCKET }}
          PGPORT: '55432'
          PGDATABASE: postgres
          D2RC_SCENARIO: short
        run: |
          D2RC_PHASE=failure python -B scripts/check_d2rc_retry_policy.py
          D2RC_PHASE=restart python -B scripts/check_d2rc_retry_policy.py
      - name: Recover once through Groq
        env:
          PYTHONPATH: .
          D2RC_PHASE: cloud
          D2RC_SHADOW: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          D2RC_FIXTURES_SHA256: '137d8d9779c8b9a890028584a39e12f14cff9c1e01a3fa9b5109738f87fd7006'
        run: |
          D2RC_PUBLIC_FIXTURES="$(cat scripts/d2rc_public_cases.json; printf x)"
          export D2RC_PUBLIC_FIXTURES="${D2RC_PUBLIC_FIXTURES%x}"
          python -B scripts/d2rc_cloud_probe.py >> "$GITHUB_STEP_SUMMARY"
      - name: Stop temporary PostgreSQL
        if: always() && env.D2RC_SOCKET != ''
        run: |
          "$(pg_config --bindir)/pg_ctl" -D "$D2RC_SOCKET/data" -m immediate stop
