name: CAPACITY private extraction baseline
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed checkout SHA
        type: string
        required: true
      free_accounts_approved:
        description: Both accounts confirmed free for this run
        type: boolean
        required: true
        default: false
      recipient_b64:
        description: Base64 public recipient certificate in PEM format
        type: string
        required: true
      recipient_sha256:
        description: SHA-256 of the approved public certificate bytes
        type: string
        required: true
permissions:
  contents: read
jobs:
  trial:
    if: >-
      github.repository == 'nab0k/bohun-the-field' &&
      github.actor == 'nab0k' &&
      github.ref == 'refs/heads/codex/capacity-baseline-20261103' &&
      github.run_attempt == '1' &&
      inputs.free_accounts_approved &&
      github.sha == inputs.approved_head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Extract and verify privately
        env:
          CAPACITY_FREE_ACCOUNTS_APPROVED: ${{ inputs.free_accounts_approved }}
          CAPACITY_PACKET_B64: ${{ secrets.CAPACITY_BASELINE_PACKET_B64 }}
          CAPACITY_RECIPIENT_B64: ${{ inputs.recipient_b64 }}
          CAPACITY_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -B scripts/capacity-auto/run_baseline.py "$RUNNER_TEMP/capacity-result.der"
      - name: Upload encrypted checkpoint
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: capacity-baseline-encrypted
          path: ${{ runner.temp }}/capacity-result.der
          if-no-files-found: ignore
          retention-days: 1
