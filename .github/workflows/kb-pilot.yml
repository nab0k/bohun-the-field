name: BOHUN knowledge-base pilot (manual, EXP-028)
run-name: C5-01 analytics probe
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed checkout SHA
        type: string
        required: true
      free_accounts_approved:
        description: Both accounts confirmed free for this run
        type: boolean
        required: true
        default: false
      recipient_b64:
        description: Base64 public recipient certificate in PEM format
        type: string
        required: true
      recipient_sha256:
        description: SHA-256 of the approved public certificate bytes
        type: string
        required: true
permissions:
  contents: read
jobs:
  trial:
    if: github.run_attempt == '1' && inputs.free_accounts_approved && github.sha == inputs.approved_head && github.actor == 'nab0k'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Write one draft, encrypted
        env:
          ANALYTICS_FREE_ACCOUNTS_APPROVED: ${{ inputs.free_accounts_approved }}
          ANALYTICS_RECIPIENT_B64: ${{ inputs.recipient_b64 }}
          ANALYTICS_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -B scripts/analytics-probe/run_probe.py "$RUNNER_TEMP/analytics-result.der"
      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: analytics-probe-encrypted
          path: ${{ runner.temp }}/analytics-result.der
          if-no-files-found: ignore
          retention-days: 1
