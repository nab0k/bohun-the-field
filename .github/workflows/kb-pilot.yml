name: C3-07 private input snapshot
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit
        type: string
        required: true
      recipient_b64:
        description: Public recipient certificate
        type: string
        required: true
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'nab0k/bohun-the-field' && github.actor == 'nab0k' && github.run_attempt == 1 && github.ref == 'refs/heads/codex/c3-07-input-audit-20261110' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Temporary PostgreSQL driver
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/c307-venv"
          "$RUNNER_TEMP/c307-venv/bin/python" -m pip install --only-binary=:all --disable-pip-version-check 'psycopg[binary]==3.3.6'
      - name: Read the snapshot and encrypt the result
        env:
          RECIPIENT_B64: ${{ inputs.recipient_b64 }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          test "${#RECIPIENT_B64}" -le 4096
          printf '%s' "$RECIPIENT_B64" | base64 -d > "$RUNNER_TEMP/c307-recipient.pem"
          "$RUNNER_TEMP/c307-venv/bin/python" -B scripts/c3-07-input-audit.py \
            "$RUNNER_TEMP/c307-recipient.pem" "$RUNNER_TEMP/c307-audit.der"
      - name: Upload the encrypted receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c307-input-audit-encrypted
          path: ${{ runner.temp }}/c307-audit.der
          if-no-files-found: error
          retention-days: 1
