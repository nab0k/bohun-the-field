name: BOHUN knowledge-base pilot (manual, EXP-028)
run-name: C1-02 classify registry
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed checkout SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  trial:
    if: github.run_attempt == '1' && github.sha == inputs.approved_head
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Classify registry
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
        run: python3 -B scripts/sources-classify/run.py "$RUNNER_TEMP/classify-result.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: classify-result
          path: ${{ runner.temp }}/classify-result.json
          if-no-files-found: ignore
          retention-days: 1
