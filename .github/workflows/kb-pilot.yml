name: BOHUN knowledge-base pilot (manual, EXP-028)
run-name: C1-05 GDELT search probe
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed checkout SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  trial:
    if: github.run_attempt == '1' && github.sha == inputs.approved_head
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One GDELT search, one retry at most
        run: |
          for attempt in 1 2; do
            code=$(curl -sS -m 60 -A "bohun-kb-pilot/1.0 (+https://bohundefence.com)" -G "https://api.gdeltproject.org/api/v2/doc/doc" \
              --data-urlencode 'query=("defense procurement" OR "defence procurement" OR "defense contract" OR "military drone") sourcelang:english' \
              --data-urlencode 'mode=artlist' --data-urlencode 'format=json' --data-urlencode 'maxrecords=75' \
              --data-urlencode 'timespan=7d' --data-urlencode 'sort=datedesc' -o "$RUNNER_TEMP/gdelt.json" -w '%{http_code}')
            echo "attempt $attempt http $code"
            [ "$code" = "200" ] && break
            sleep 60
          done
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: gdelt-result
          path: ${{ runner.temp }}/gdelt.json
          if-no-files-found: ignore
          retention-days: 1
