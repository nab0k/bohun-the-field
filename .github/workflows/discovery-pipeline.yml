name: Discovery Pipeline (candidate registry)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/discovery_pipeline.py'
      - 'tests/test_discovery_pipeline.py'
      - '.github/workflows/discovery-pipeline.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run registry integration test
        run: python -m unittest discover -s tests -p 'test_discovery_pipeline.py' -v
