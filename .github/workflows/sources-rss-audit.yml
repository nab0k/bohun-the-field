name: Sources RSS audit
on:
  push:
    branches: [sources/rss-validation-20261011]
    paths:
      - '.github/workflows/sources-rss-audit.yml'
      - 'tools/source_audit/validate_rss.py'
      - 'data/sources/bohundefence_sources_prefilter_20261011.csv'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of rows to check (maximum 342)'
        required: false
        default: '342'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate source file exists
        run: test -f data/sources/bohundefence_sources_prefilter_20261011.csv
      - name: Check RSS and Atom (read-only)
        env:
          LIMIT: ${{ github.event.inputs.limit || '342' }}
        run: |
          python3 tools/source_audit/validate_rss.py --input data/sources/bohundefence_sources_prefilter_20261011.csv --output rss-validation-results.csv --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: sources-rss-validation
          path: rss-validation-results.csv
          retention-days: 30
