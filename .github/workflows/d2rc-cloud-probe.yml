name: D2RC cloud probe
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA
        required: true
        type: string
      public_fixtures:
        description: Reviewed JSON array of two public cases
        required: true
        type: string
      fixtures_sha256:
        description: SHA-256 of the exact public fixture JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bohun-d2rc-cloud-probe
  cancel-in-progress: false
jobs:
  trial:
    if: github.repository == 'nab0k/bohun-the-field' && github.actor == 'nab0k' && github.run_attempt == '1' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned database driver
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
      - name: Start isolated PostgreSQL and simulate outage
        env:
          PYTHONPATH: .
          D2RC_PHASE: outage
        run: |
          pg=$(pg_config --bindir)
          cluster=$(mktemp -d "$RUNNER_TEMP/d2rc.XXXXXXXX")
          "$pg/initdb" -D "$cluster/data" -A trust --no-locale -E UTF8 >/dev/null
          "$pg/pg_ctl" -D "$cluster/data" -l "$cluster/server.log" -o "-c listen_addresses= -k $cluster -p 55432" -w start
          echo "D2RC_SOCKET=$cluster" >> "$GITHUB_ENV"
          D2RC_SOCKET="$cluster" python -B scripts/d2rc_cloud_probe.py
      - name: Recover once through Groq
        env:
          PYTHONPATH: .
          D2RC_PHASE: cloud
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          D2RC_PUBLIC_FIXTURES: ${{ inputs.public_fixtures }}
          D2RC_FIXTURES_SHA256: ${{ inputs.fixtures_sha256 }}
        run: python -B scripts/d2rc_cloud_probe.py >> "$GITHUB_STEP_SUMMARY"
      - name: Stop temporary PostgreSQL
        if: always() && env.D2RC_SOCKET != ''
        run: |
          "$(pg_config --bindir)/pg_ctl" -D "$D2RC_SOCKET/data" -m immediate stop
