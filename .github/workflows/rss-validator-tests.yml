name: RSS validator regression tests
on:
  pull_request:
    paths:
      - 'tools/validate_candidate_feeds.py'
      - 'tests/test_validate_candidate_feeds.py'
      - '.github/workflows/rss-validator-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install feedparser requests
      - run: python -m unittest discover -s tests -p 'test_validate_candidate_feeds.py' -v
