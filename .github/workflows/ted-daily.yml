name: Bohundefence TED Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: read

concurrency:
  group: bohun-ted-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name != 'eng01-gemini-pilot-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]"

      - name: Collect TED notices
        run: |
          mkdir -p output
          python collectors/ted/tender_v4.py \
            --db output/tenders.sqlite3 \
            --out output/tenders_v4.csv \
            --since "$(date -u -d '14 days ago' +%Y%m%d)" \
            --limit 100

      - name: Import into Supabase
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python collectors/ted/import_ted.py \
            --db output/tenders.sqlite3 \
            --apply

      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ted-results
          path: output/
          retention-days: 30

  eng01_internal_pilot:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'eng01-gemini-pilot-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]"
      - name: Internal 10-item Gemini QA trial (read-only, no publication)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python scripts/eng01_gemini_pilot.py
      - name: Preserve QA-only evidence even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng01-private-qa-cards
          path: output/eng01/
          if-no-files-found: warn
          retention-days: 7
