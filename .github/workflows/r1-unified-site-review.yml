name: R1 unified site review (NO DEPLOY)
on:
  push:
    branches: [r1-unified-site-review-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-r1-unified.mjs
      - run: npm test
      - run: npm run build:site
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start existing Atlas locally
        run: |
          mkdir -p output/r1-review
          (npm run dev -- --host 127.0.0.1 --port 5174 > output/r1-review/vite.log 2>&1 &)
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5174/atlas.html >/dev/null; then exit 0; fi; sleep 2; done
          exit 1
      - name: Browser smoke desktop and mobile, screenshots
        run: node scripts/r1-browser-smoke.mjs
      - name: Assert internal HOLD data excluded
        run: |
          test ! -f dist/atlas/pilot-internal-feed.json
          test ! -d dist/dev
          test -f dist/index.html
          grep -q 'id="map"' dist/index.html
      - name: Upload review build, not public deployment
        uses: actions/upload-artifact@v4
        with:
          name: r1-unified-site-review-build
          path: |
            dist/
            output/r1-review/
          retention-days: 14
