name: EXP-016 EDF candidate cards, one approved run
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact separately approved full commit SHA
        required: true
        type: string
      confirmation:
        description: Type EDF_CARDS_ONE_RUN for this separately approved run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: exp016-edf-cards
  cancel-in-progress: false
jobs:
  cards:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'nab0k/bohun-the-field' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'EDF_CARDS_ONE_RUN'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CARDS_CONFIRMATION: ${{ inputs.confirmation }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the approved SHA before checkout
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
          check-latest: false
      - name: Install the pinned libraries, no secrets
        env:
          NATIVE_CONFIRMATION: SYNTHETIC_NATIVE_ONLY
        run: |
          set -euo pipefail
          umask 077
          python experiments/exp016_enrichment/cloud_environment.py prepare
      - name: Original libraries pass on synthetic data, no secrets
        env:
          NATIVE_CONFIRMATION: SYNTHETIC_NATIVE_ONLY
        run: |
          set -euo pipefail
          umask 077
          python experiments/exp016_enrichment/cloud_environment.py verify
      - name: One pass over the listed home pages
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          EXP016_CARDS_PACKET_1: ${{ secrets.EXP016_CARDS_PACKET_1 }}
          EXP016_CARDS_PACKET_2: ${{ secrets.EXP016_CARDS_PACKET_2 }}
          EXP016_CARDS_PACKET_3: ${{ secrets.EXP016_CARDS_PACKET_3 }}
          EXP016_CARDS_PACKET_4: ${{ secrets.EXP016_CARDS_PACKET_4 }}
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/exp016-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/venv/bin/python" experiments/exp016_edf_cards/run.py
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp016-edf-cards-cms
          path: ${{ runner.temp }}/exp016-edf-cards/result.cms
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
