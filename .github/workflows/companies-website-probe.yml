name: Company website probe (EXP-035)

# Owner 25.11.2026 «Yes, run it»: one read-only probe of the website finder on 40 cards, run from the feature branch
# (a workflow_dispatch file must live on main, so a push to this branch starts it). Writes nothing to the base.
on:
  push:
    branches: [feat/companies-website-finder]
    paths: ['collectors/companies/website_finder.py', 'scripts/companies-website-probe.py',
            '.github/workflows/companies-website-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'nab0k/bohun-the-field'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests first
        run: python -m unittest discover -s tests/companies -t .
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]"
      - name: Probe
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python scripts/companies-website-probe.py website-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: website-probe
          path: website-probe.json
          retention-days: 7
