# TEMPORARY REVIEW-BRANCH DIAGNOSTIC. Delete after one checked run.
# Explicit owner request: verify R5.1 on live public sources, no data writes.
name: EXP009 R5.1 one-off live quality (HOLD only)
on:
  push:
    branches:
      - review/exp009-r5-live-quality-20261021
    paths:
      - 'collectors/official_source_review/r5_quality.py'
      - 'collectors/official_source_review/r5_quality_hardened.py'
      - 'collectors/official_source_review/test_r5_quality_hardened.py'
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression suite
        working-directory: collectors/official_source_review
        run: python -m unittest -v
      - name: Four bounded live read-only quality probes
        working-directory: collectors/official_source_review
        run: |
          failures=0
          for src in uk ca_new ca_open eu; do
            echo "SOURCE=$src; aggregate HOLD diagnostics only"
            python r5_quality.py --live-read-only --source "$src" || failures=$((failures + 1))
          done
          exit $([ "$failures" -eq 0 ])
