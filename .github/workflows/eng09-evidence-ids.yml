name: ENG09 Evidence-ID Contract Three Fixtures (NO DEPLOY)
on:
  push:
    branches: [eng09-evidence-ids-three-fixtures-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-bound IDs, reject invented evidence, fail closed
        run: |
          python - <<'PY'
          import json
          schema=json.load(open('intelligence/schemas/intelligence-card-v1.schema.json'))
          c=schema['properties']['claims']['items']
          assert 'evidence_id' in c['required'] and 'evidence_id' in c['properties']
          print('Shared intelligence card evidence_id required: PASS')
          PY
          python -m py_compile scripts/eng09_evidence_resolver.py
          python scripts/eng09_evidence_resolver.py
      - name: Retrieve actual Lockheed Martin K6 published HTML and text spans
        run: python scripts/eng09_k6_source_extract.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng09-three-fixture-evidence-contract-audit
          path: |
            output/eng09-evidence/
            output/eng09-k6/
          retention-days: 14
