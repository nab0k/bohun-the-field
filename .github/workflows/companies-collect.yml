name: Companies collector (EXP-012)

# Tests run on every PR change. The collection job (owner consents in DECISIONS) runs ONLY when
# the PR gets the label below: Supabase schema `companies`, 10 records per source,
# GLEIF for 20 companies. No schedule (T09 needs separate consent). Nothing is written to Notion.
# The repository is public: the log shows aggregate counts and a 20-company review sample from public
# sources (Ukrainian companies are not listed); no data files are uploaded.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'collectors/companies/**'
      - 'tests/companies/**'
      - 'db/companies/**'
      - 'scripts/companies-collect.py'
      - '.github/workflows/companies-collect.yml'

permissions:
  contents: read

concurrency:
  group: companies-collect
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (stdlib only)
        run: python -m unittest discover -s tests/companies -t . -v
      - name: Python compilation (all EXP-012 modules and tests)
        run: |
          git ls-files 'collectors/companies/*.py' 'collectors/companies/sources/*.py' 'tests/companies/*.py' 'scripts/companies-collect.py' | xargs -r python -m py_compile
      - name: Diff whitespace check (against main)
        run: git diff --check origin/main...HEAD
      - name: Official Eurosatory source read-only probe (no database access)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from collectors.companies.sources.http import JsonHttp
          from collectors.companies.sources.eurosatory import URL, Exhibitors2024, parse_html
          from collectors.companies.pipeline import run_source
          from collectors.companies.report import summary
          from collectors.companies.store import SqliteStore
          expected = "57741139274266eff5c0f1900790f88f42f8b806d7747192603a8ef70ef1bc96"
          report = {"source_url": URL, "expected_sha256": expected}
          try:
              raw = JsonHttp(timeout=18, retries=1, backoff=1.0).get_bytes(URL, accept="text/html")
              if not raw:
                  raise ValueError("empty_source")
              digest = hashlib.sha256(raw).hexdigest()
              report.update(status="historical_hash_verified" if digest == expected else "live_revision_not_historical",
                            sha256=digest, snapshot_bytes=len(raw))
              # Immutable artifact is evidence for investigation, NOT an approved staging source.
              folder = pathlib.Path("output/source-probe")
              folder.mkdir(parents=True, exist_ok=True)
              (folder / ("eurosatory_2024_exhibitors-" + digest + ".html")).write_bytes(raw)
              rows = parse_html(raw)
              report["parsed_unique_pairs"] = len(rows)
              class SnapshotHTTP:
                  def get_bytes(self, url, accept="*/*"):
                      if url != URL:
                          raise ValueError("unexpected source")
                      return raw
              store = SqliteStore(":memory:")
              adapter = Exhibitors2024()
              first = run_source(store, adapter, SnapshotHTTP(), 2500)
              again = run_source(store, adapter, SnapshotHTTP(), 2500)
              report["first_run"] = {k: first.get(k) for k in (
                  "status","fetched","new_observations","discoveries",
                  "candidate_existing","holds","new_companies","cursor_out")}
              report["replay"] = {k: again.get(k) for k in (
                  "status","fetched","new_observations","discoveries","new_companies","cursor_out")}
              report["sqlite_company_rows"] = summary(store)["companies"]
              report["sqlite_discovery_candidates"] = summary(store)["discovery_candidates"]
              if (first["status"] != "ok" or first["fetched"] != 2015 or
                  first["discoveries"] != 2015 or first["new_companies"] != 0 or
                  report["sqlite_discovery_candidates"] != 2015 or
                  first["cursor_out"] != "done:" + digest or
                  again["fetched"] != 0 or again["new_observations"] != 0 or
                  report["sqlite_company_rows"] != 0):
                  report["status"] = "real_source_offline_acceptance_failed"
          except Exception as exc:
              report["status"] = "real_source_probe_failed"
              report["error_type"] = type(exc).__name__
          pathlib.Path("output/source-probe").mkdir(parents=True, exist_ok=True)
          pathlib.Path("output/source-probe/report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print("EUROSATORY_PROBE " + json.dumps(report, sort_keys=True))
          PY
      - name: Keep read-only source-probe evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurosatory-source-readonly-probe
          path: output/source-probe/
          retention-days: 30

  collect-trial:
    # Owner consent D-20261019-EXP012-MVP-1: up to three runs, schema is NOT re-created.
    # The earlier labels exp012-collect-reset / exp012-collect-replay are retired: their two consented runs are used,
    # and a reset would now drop the 3470 staged companies (incl. the legacy import).
    if: github.event.action == 'labeled' && github.event.label.name == 'exp012-run-step'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests first
        run: python -m unittest discover -s tests/companies -t .
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]"
      - name: EDF trial, card rule and completeness (Supabase schema companies)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python scripts/companies-collect.py --store supabase \
            --sources edf --limit 10 --gleif 20 --promote \
            --benchmark collectors/companies/benchmarks/sipri_top100_2024.json \
            --benchmark collectors/companies/benchmarks/dod_top_recipients_fy2025.json \
            --report --sample 20

  discovery-staging-once:
    # Explicitly owner-approved staging intake, scoped to PR #78 and a maintainer label.
    # No migration, reset, promotion, GLEIF, publication, Notion or schedule.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'discovery-scale-v1-staging-once' &&
      github.event.pull_request.number == 78 &&
      github.event.pull_request.head.repo.full_name == 'nab0k/bohun-the-field' &&
      github.event.pull_request.head.ref == 'feature/discovery-scale-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline company tests before staging
        run: python -m unittest discover -s tests/companies -t .
      - name: Install existing PostgreSQL driver
        run: python -m pip install "psycopg[binary]"
      - name: One-time Eurosatory discovery staging and immediate readback
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from collectors.companies import pipeline
          from collectors.companies.pg_store import PgStore
          from collectors.companies.sources.eurosatory import Exhibitors2024, URL, parse_html
          from collectors.companies.sources.http import JsonHttp

          EXPECT_COUNT = 3751
          EXPECT_FP = "6b3b6ab3af3fc20b0bc10eb6a6068c74"
          SOURCE = "eurosatory_2024_exhibitors"
          out = pathlib.Path("output/discovery-staging-once")
          out.mkdir(parents=True, exist_ok=True)
          store = PgStore()

          def company_state():
              return store.query("""
                SELECT count(*) AS n,
                  md5(string_agg(md5(to_jsonb(c)::text),'|' ORDER BY c.id)) AS fingerprint
                FROM company c""")[0]

          def counts():
              row = store.query("""
                SELECT (SELECT count(*) FROM observation WHERE source=?) AS source_observations,
                       (SELECT count(*) FROM discovery_candidate) AS all_discovery_candidates,
                       (SELECT count(*) FROM discovery_candidate d JOIN observation o
                          ON o.id=d.observation_id WHERE o.source=?) AS source_candidates
              """, (SOURCE, SOURCE))[0]
              return {k: int(v) for k, v in row.items()}

          before_company = company_state()
          before = counts()
          assert int(before_company["n"]) == EXPECT_COUNT, "company count preflight changed"
          assert before_company["fingerprint"] == EXPECT_FP, "company fingerprint preflight changed"
          assert before["source_observations"] == 0, "Eurosatory source already staged; stop"
          assert before["source_candidates"] == 0, "Eurosatory candidates already staged; stop"
          migrations = store.query("SELECT version FROM schema_migration ORDER BY version")
          assert [r["version"] for r in migrations] == [1, 2], "migration ledger incomplete"

          raw = JsonHttp(timeout=30, retries=2, backoff=2).get_bytes(URL, accept="text/html")
          assert raw, "official source unavailable"
          digest = hashlib.sha256(raw).hexdigest()
          rows = parse_html(raw)
          assert len(rows) == 2015, "source changed its unique exhibitor count"
          file = out / ("eurosatory_2024_exhibitors-" + digest + ".html")
          with file.open("xb") as fh:
              fh.write(raw)

          class FrozenHttp:
              def get_bytes(self, url, accept="*/*"):
                  if url != URL:
                      raise ValueError("unexpected URL")
                  return raw

          adapter = Exhibitors2024()
          first = pipeline.run_source(store, adapter, FrozenHttp(), 2500)
          if first["status"] != "ok":
              raise RuntimeError("staging intake failed; inspect aggregate run status")
          after = counts()
          after_company = company_state()
          assert int(after_company["n"]) == EXPECT_COUNT, "company count changed after staging"
          assert after_company["fingerprint"] == EXPECT_FP, "company contents changed after staging"
          assert first["new_companies"] == 0, "discovery unexpectedly created company rows"
          assert first["fetched"] == 2015 and first["new_observations"] == 2015, "unexpected intake count"
          assert first["discoveries"] == 2015, "unexpected candidate count"
          assert after["source_observations"] == 2015 and after["source_candidates"] == 2015, "readback mismatch"
          assert first["cursor_out"] == "done:" + digest, "unexpected cursor"

          replay = pipeline.run_source(store, adapter, FrozenHttp(), 2500)
          assert replay["status"] == "ok", "replay status failed"
          assert replay["fetched"] == 0 and replay["new_observations"] == 0, "replay duplicated observations"
          assert company_state()["fingerprint"] == EXPECT_FP, "company fingerprint changed during replay"
          assert counts()["source_observations"] == 2015, "replay changed observation count"

          status = store.query("""
            SELECT d.status, count(*) AS n
            FROM discovery_candidate d
            JOIN observation o ON o.id = d.observation_id
            WHERE o.source=?
            GROUP BY d.status ORDER BY d.status""", (SOURCE,))
          report = {
              "status": "staging_readback_verified",
              "source": SOURCE, "snapshot_sha256": digest, "snapshot_bytes": len(raw),
              "company_count_before": int(before_company["n"]),
              "company_count_after": int(company_state()["n"]),
              "company_fingerprint_unchanged": True,
              "before": before, "after": after, "first_run": {k: first.get(k) for k in (
                 "status","fetched","new_observations","discoveries","candidate_existing",
                 "holds","new_companies","cursor_out")},
              "replay": {k: replay.get(k) for k in (
                 "status","fetched","new_observations","discoveries","new_companies","cursor_out")},
              "discovery_by_status": {r["status"]: r["n"] for r in status},
          }
          (out / "report.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print("DISCOVERY_STAGING " + json.dumps(report, sort_keys=True))
          PY
      - name: Archive source and aggregate staging report for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurosatory-staging-once-verified
          path: output/discovery-staging-once/
          retention-days: 30
