name: Companies collector (EXP-012)

# Tests run on every PR change. The collection job (owner consents in DECISIONS) runs ONLY when
# the PR gets the label below: Supabase schema `companies`, 10 records per source,
# GLEIF for 20 companies. No schedule (T09 needs separate consent). Nothing is written to Notion.
# The repository is public: the log shows aggregate counts and a 20-company review sample from public
# sources (Ukrainian companies are not listed); no data files are uploaded.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'collectors/companies/**'
      - 'tests/companies/**'
      - 'db/companies/**'
      - 'scripts/companies-collect.py'
      - '.github/workflows/companies-collect.yml'

permissions:
  contents: read

concurrency:
  group: companies-collect
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (stdlib only)
        run: python -m unittest discover -s tests/companies -t . -v
      - name: Python compilation (all EXP-012 modules and tests)
        run: |
          git ls-files 'collectors/companies/*.py' 'collectors/companies/sources/*.py' 'tests/companies/*.py' 'scripts/companies-collect.py' | xargs -r python -m py_compile
      - name: Diff whitespace check (against main)
        run: git diff --check origin/main...HEAD
      - name: Official Eurosatory source read-only probe (no database access)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from collectors.companies.sources.http import JsonHttp
          from collectors.companies.sources.eurosatory import URL, Exhibitors2024, parse_html
          from collectors.companies.pipeline import run_source
          from collectors.companies.report import summary
          from collectors.companies.store import SqliteStore
          expected = "57741139274266eff5c0f1900790f88f42f8b806d7747192603a8ef70ef1bc96"
          report = {"source_url": URL, "expected_sha256": expected}
          try:
              raw = JsonHttp(timeout=18, retries=1, backoff=1.0).get_bytes(URL, accept="text/html")
              if not raw:
                  raise ValueError("empty_source")
              digest = hashlib.sha256(raw).hexdigest()
              report.update(status="historical_hash_verified" if digest == expected else "live_revision_not_historical",
                            sha256=digest, snapshot_bytes=len(raw))
              # Immutable artifact is evidence for investigation, NOT an approved staging source.
              folder = pathlib.Path("output/source-probe")
              folder.mkdir(parents=True, exist_ok=True)
              (folder / ("eurosatory_2024_exhibitors-" + digest + ".html")).write_bytes(raw)
              rows = parse_html(raw)
              report["parsed_unique_pairs"] = len(rows)
              class SnapshotHTTP:
                  def get_bytes(self, url, accept="*/*"):
                      if url != URL:
                          raise ValueError("unexpected source")
                      return raw
              store = SqliteStore(":memory:")
              adapter = Exhibitors2024()
              first = run_source(store, adapter, SnapshotHTTP(), 2500)
              again = run_source(store, adapter, SnapshotHTTP(), 2500)
              report["first_run"] = {k: first.get(k) for k in (
                  "status","fetched","new_observations","discoveries",
                  "candidate_existing","holds","new_companies","cursor_out")}
              report["replay"] = {k: again.get(k) for k in (
                  "status","fetched","new_observations","discoveries","new_companies","cursor_out")}
              report["sqlite_company_rows"] = summary(store)["companies"]
              report["sqlite_discovery_candidates"] = summary(store)["discovery_candidates"]
              if (first["status"] != "ok" or first["fetched"] != 2015 or
                  first["discoveries"] != 2015 or first["new_companies"] != 0 or
                  report["sqlite_discovery_candidates"] != 2015 or
                  first["cursor_out"] != "done:" + digest or
                  again["fetched"] != 0 or again["new_observations"] != 0 or
                  report["sqlite_company_rows"] != 0):
                  report["status"] = "real_source_offline_acceptance_failed"
          except Exception as exc:
              report["status"] = "real_source_probe_failed"
              report["error_type"] = type(exc).__name__
          pathlib.Path("output/source-probe").mkdir(parents=True, exist_ok=True)
          pathlib.Path("output/source-probe/report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print("EUROSATORY_PROBE " + json.dumps(report, sort_keys=True))
          PY
      - name: Keep read-only source-probe evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurosatory-source-readonly-probe
          path: output/source-probe/
          retention-days: 30

  collect-trial:
    # Owner consent D-20261019-EXP012-MVP-1: up to three runs, schema is NOT re-created.
    # The earlier labels exp012-collect-reset / exp012-collect-replay are retired: their two consented runs are used,
    # and a reset would now drop the 3470 staged companies (incl. the legacy import).
    if: github.event.action == 'labeled' && github.event.label.name == 'exp012-run-step'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests first
        run: python -m unittest discover -s tests/companies -t .
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]"
      - name: EDF trial, card rule and completeness (Supabase schema companies)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python scripts/companies-collect.py --store supabase \
            --sources edf --limit 10 --gleif 20 --promote \
            --benchmark collectors/companies/benchmarks/sipri_top100_2024.json \
            --benchmark collectors/companies/benchmarks/dod_top_recipients_fy2025.json \
            --report --sample 20

  enrich02-readonly-review20:
    # Explicitly label-gated one-time live SELECT validation for PR #80.
    # Private 81-row output stays on temporary runner; no public artifact.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'enrich02-readonly-review20' &&
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == 'nab0k/bohun-the-field' &&
      github.event.pull_request.head.ref == 'feature/discovery-evidence-02'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full offline regression before live SELECT
        run: python -m unittest discover -s tests/companies -t .
      - name: Existing PostgreSQL client only
        run: python -m pip install "psycopg[binary]"
      - name: Read frozen 81 and create 20 unverified packets on ephemeral private disk
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python -m collectors.companies.enrich_pilot --read-supabase \
            --review20 --private-output-dir "$RUNNER_TEMP/bohun-enrich02-evidence"
          # Ephemeral research files intentionally NOT uploaded.
