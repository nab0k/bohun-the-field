name: Companies collector (EXP-012)

# Tests run on every PR change. The collection job (T08 trials, owner consents 18.10.2026) runs ONLY when
# the PR gets one of the labels below: Supabase schema `companies`, 10 records per source,
# GLEIF for 20 companies. No schedule (T09 needs separate consent). Nothing is written to Notion.
# The repository is public: the log shows aggregate counts and a 20-company review sample from public
# sources (Ukrainian companies are not listed); no data files are uploaded.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'collectors/companies/**'
      - 'tests/companies/**'
      - 'db/companies/**'
      - 'scripts/companies-collect.py'
      - '.github/workflows/companies-collect.yml'

permissions:
  contents: read

concurrency:
  group: companies-collect
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (stdlib only)
        run: python -m unittest discover -s tests/companies -t . -v

  collect-trial:
    # Owner consent D-20261018-EXP012-T08b: two runs.
    #   label exp012-collect-reset  -> DROP SCHEMA companies, re-create, collect;
    #   label exp012-collect-replay -> collect again from the first pages (no duplicates expected, AC1).
    if: >-
      github.event.action == 'labeled' &&
      (github.event.label.name == 'exp012-collect-reset' || github.event.label.name == 'exp012-collect-replay')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests first
        run: python -m unittest discover -s tests/companies -t .
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]"
      - name: Trial collection into Supabase schema companies
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODE: ${{ github.event.label.name == 'exp012-collect-reset' && '--reset-staging' || '--replay' }}
        run: |
          python scripts/companies-collect.py --store supabase --migrate $MODE \
            --sources usaspending_recipients,usaspending_subawards,ted,prozorro \
            --limit 10 --gleif 20 --report --sample 20
