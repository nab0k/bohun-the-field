name: Bohundefence Web Monitor (pilot)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write candidate URLs to Supabase (unverified, not publishable)"
        type: boolean
        default: false
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: read
concurrency:
  group: bohun-web-monitor
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]"
      - name: Discover public pages
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then
            python collectors/web_monitor/monitor.py --apply
          else
            python collectors/web_monitor/monitor.py
          fi
