name: Bohundefence Web Monitor (pilot)
on:
  pull_request:
    paths:
      - 'collectors/web_monitor/**'
      - 'tests/test_web_monitor_*.py'
      - '.github/workflows/web-monitor.yml'
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: "Channel listings (default) or legacy sitemap exploration"
        type: choice
        options:
          - channels
          - legacy
        default: channels
      country:
        description: "Optional country filter, e.g. DE"
        type: string
        default: ""
      audit_metadata:
        description: "Read-only metadata audit of up to 3 article candidates per source"
        type: boolean
        default: false
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: read
concurrency:
  group: bohun-web-monitor
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]"
      - name: Offline channel discovery tests
        run: python -m unittest discover -s tests -p "test_web_monitor_*.py"
      - name: Discover public pages
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.audit_metadata }}" = "true" ]; then
            python collectors/web_monitor/monitor.py --discovery-mode "${{ inputs.discovery_mode || 'channels' }}" --country "${{ inputs.country }}" --audit-metadata
          else
            python collectors/web_monitor/monitor.py --discovery-mode "${{ inputs.discovery_mode || 'channels' }}"
          fi
