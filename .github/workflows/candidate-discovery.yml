name: Candidate Discovery v1 (directory leads)
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Discover external candidate websites
        run: python tools/candidate_discovery.py --max-pages 100
      - name: Upload review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bohun-candidate-discovery-v1
          path: output/candidate-discovery/
          retention-days: 30
