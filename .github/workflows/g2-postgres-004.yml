name: G2 SQL 004 on isolated PostgreSQL 17 (NO SUPABASE)
on:
  push:
    branches: [feature/g2-private-profile-claims-20261022]
    paths:
      - '.github/workflows/g2-postgres-004.yml'
      - 'tests/companies/test_g2_postgres_migration.py'
      - 'db/companies/001_companies_schema.sql'
      - 'db/companies/004_private_profile_claims.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-only
          POSTGRES_DB: bohun_g2_ephemeral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d bohun_g2_ephemeral_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BOHUN_G2_TEST_POSTGRES_DSN: postgresql://postgres:ephemeral-only@127.0.0.1:5432/bohun_g2_ephemeral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated Postgres driver
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Compile migration test
        run: python -m py_compile tests/companies/test_g2_postgres_migration.py
      - name: PostgreSQL 17 schema, access, FKs, HOLD, idempotency and rollback
        run: python -m unittest discover -s tests/companies -p test_g2_postgres_migration.py -t . -v
