name: Eng09 Inoreader Text Coverage Aggregate (READ ONLY)
on:
  push:
    branches: [eng09-inoreader-evidence-e2e-20261012]
    paths:
      - 'scripts/audit-inoreader-text-coverage.py'
      - '.github/workflows/eng09-inoreader-text-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]"
      - name: Read only Supabase metadata; output aggregates only
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output/inoreader-text-audit
          python scripts/audit-inoreader-text-coverage.py > output/inoreader-text-audit/aggregates.json
          python -m json.tool output/inoreader-text-audit/aggregates.json
      - uses: actions/upload-artifact@v4
        with:
          name: inoreader-text-coverage-aggregates-only
          path: output/inoreader-text-audit/aggregates.json
          retention-days: 14
