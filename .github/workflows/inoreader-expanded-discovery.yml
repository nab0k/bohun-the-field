name: Expand Inoreader source discovery (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inoreader-expanded-discovery.yml
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * 2'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source registry from two evidence sets
        run: python collectors/inoreader/build_expanded_registry.py
      - name: Discover and compare to live Inoreader API
        env:
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
        run: |
          python collectors/inoreader/inoreader_source_manager.py \
            --registry output/source-discovery-expanded.json --check-subscriptions \
            --workers 4 --report output/expanded-discovery-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-source-discovery
          path: output/
          retention-days: 30
          if-no-files-found: ignore
