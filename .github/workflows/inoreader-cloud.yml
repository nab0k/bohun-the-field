name: Bohundefence Inoreader Cloud — bounded manual trials

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Reviewed full commit SHA on codex/exp009-cloud-pipeline'
        required: true
        type: string
      mode:
        description: 'Every live mode needs separate approval; apply needs fingerprints, intake/read need batch_id'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - intake
          - read
          - pipeline
      batch_id:
        description: 'Intake/read only: separately approved preallocated batch UUID; never refetch on uncertainty'
        required: false
        type: string
      db_fingerprint:
        description: 'Apply only: separately reviewed catalog fingerprint'
        required: false
        type: string
      batch_fingerprint:
        description: 'Apply only: separately reviewed candidate batch fingerprint'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bohun-inoreader-cloud
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/exp009-cloud-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check reviewed ref and mode before dependencies or credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode }}
          DB_FINGERPRINT: ${{ inputs.db_fingerprint }}
          BATCH_FINGERPRINT: ${{ inputs.batch_fingerprint }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/codex/exp009-cloud-pipeline'
          test "${#EXPECTED_SHA}" -eq 40
          case "$EXPECTED_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          case "$MODE" in
            preview) ;;
            pipeline) ;;
            apply)
              test "${#DB_FINGERPRINT}" -eq 64
              test "${#BATCH_FINGERPRINT}" -eq 64
              ;;
            intake|read)
              python3 - <<'PY'
          import os
          from uuid import UUID
          value = os.environ['BATCH_ID']
          try:
              valid = str(UUID(value)) == value
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit('INVALID_BATCH_UUID')
          PY
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline probe and capture regression checks
        run: |
          python -B -m unittest discover -s tests -p 'test_inoreader_probe.py'
          python -B -m unittest discover -s tests -p 'test_inoreader_content.py'
          python -B -m unittest discover -s tests -p 'test_inoreader_rate_limit.py'
          python -B -m unittest discover -s tests -p 'test_inoreader_source_manager.py'
          python -B -m unittest discover -s tests -p 'test_inoreader_intake.py'
      - run: python -m pip install "psycopg[binary]==3.3.6"
        if: inputs.mode != 'pipeline'
      - name: Offline runtime and web boundary checks
        if: inputs.mode == 'pipeline'
        run: |
          python -B -m unittest discover -s tests/intelligence_pipeline -p 'test_*.py'
          python -B -m unittest discover -s tests -p 'test_web_monitor_content.py'
      - name: Install reviewed web extractor in ephemeral cloud runner
        if: inputs.mode == 'pipeline'
        run: |
          python -m venv "$RUNNER_TEMP/exp009-runtime-input29"
          "$RUNNER_TEMP/exp009-runtime-input29/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6' 'trafilatura==2.3.1'
      - name: Probe existing capture — preview by default, at most five new rows
        if: inputs.mode == 'preview' || inputs.mode == 'apply'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode }}
          DB_FINGERPRINT: ${{ inputs.db_fingerprint }}
          BATCH_FINGERPRINT: ${{ inputs.batch_fingerprint }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          case "$MODE" in
            preview)
              python -B -m collectors.inoreader.probe --expected-sha "$EXPECTED_SHA"
              ;;
            apply)
              python -B -m collectors.inoreader.probe --expected-sha "$EXPECTED_SHA" \
                --apply --expected-db-fingerprint "$DB_FINGERPRINT" \
                --expected-batch-fingerprint "$BATCH_FINGERPRINT"
              ;;
            *) exit 1 ;;
          esac
      - name: Capture one retained body into private intake
        if: inputs.mode == 'intake'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          BOHUN_INTAKE_DSN: ${{ secrets.BOHUN_INTAKE_DSN }}
        run: |
          test -n "$BOHUN_INTAKE_DSN"
          umask 077
          python -B -m collectors.inoreader.intake capture --expected-sha "$EXPECTED_SHA" \
            --batch-id "$BATCH_ID" --max-items 1 --require-body --allow-live \
            | tee "$RUNNER_TEMP/exp009-intake-summary.json"
      - name: Independently read same batch without OAuth and compare safe summaries
        if: inputs.mode == 'intake' || inputs.mode == 'read'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          MODE: ${{ inputs.mode }}
          BOHUN_INTAKE_DSN: ${{ secrets.BOHUN_INTAKE_DSN }}
        run: |
          test -n "$BOHUN_INTAKE_DSN"
          umask 077
          python -B -m collectors.inoreader.intake read --expected-sha "$EXPECTED_SHA" \
            --batch-id "$BATCH_ID" --allow-live > "$RUNNER_TEMP/exp009-read-summary.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((root / 'exp009-read-summary.json').read_text())
          if (report['batch_id'] != os.environ['BATCH_ID'] or report['items'] != 1
                  or report['body_items'] != 1 or report['result'] != 'BODY_SNAPSHOT_READBACK'):
              raise SystemExit('INTAKE_ONE_BODY_READBACK_REQUIRED')
          keys = ('batch_id', 'manifest_sha256', 'items', 'body_items', 'payload_bytes', 'contract_version')
          if os.environ['MODE'] == 'intake':
              captured = json.loads((root / 'exp009-intake-summary.json').read_text())
              if any(captured[k] != report[k] for k in keys):
                  raise SystemExit('INTAKE_INDEPENDENT_SUMMARY_MISMATCH_NO_RETRY')
          print(json.dumps({k: report[k] for k in keys}, sort_keys=True))
          PY
      - name: Remove private trial summaries
        if: always() && (inputs.mode == 'intake' || inputs.mode == 'read')
        run: rm -f "$RUNNER_TEMP/exp009-intake-summary.json" "$RUNNER_TEMP/exp009-read-summary.json"
      - name: Run selected INPUT29 pipeline with separately approved access mode
        if: inputs.mode == 'pipeline'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BOHUN_RUNTIME_CONFIG: ${{ secrets.BOHUN_RUNTIME_CONFIG }}
          BOHUN_RUNTIME_DSN: ${{ secrets.BOHUN_RUNTIME_DSN }}
          BOHUN_INTAKE_DSN: ${{ secrets.BOHUN_INTAKE_DSN }}
          BOHUN_NOTION_TOKEN: ${{ secrets.BOHUN_NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
        run: |
          umask 077
          python -B - <<'PY'
          import os
          from pathlib import Path
          value = os.environ['BOHUN_RUNTIME_CONFIG']
          if not value or len(value.encode()) > 256 * 1024:
              raise SystemExit('RUNTIME_CONFIG_MISSING_OR_TOO_LARGE')
          target = Path(os.environ['RUNNER_TEMP']) / 'exp009-runtime-config.json'
          with target.open('x') as handle:
              handle.write(value)
          PY
          "$RUNNER_TEMP/exp009-runtime-input29/bin/python" -B scripts/intelligence-pipeline.py runtime --allow-live \
            --expected-sha "$EXPECTED_SHA" --config "$RUNNER_TEMP/exp009-runtime-config.json"
      - name: Remove private runtime configuration
        if: always() && inputs.mode == 'pipeline'
        run: rm -f "$RUNNER_TEMP/exp009-runtime-config.json"
