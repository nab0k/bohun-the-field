name: Bohundefence Inoreader Cloud

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit for one bounded 12-item body-storage pilot
        required: true
        type: string
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: bohun-inoreader-cloud
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ vars.INOREADER_CUTOVER_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard reviewed manual revision before credentials
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "${#EXPECTED_SHA}" -eq 40
          case "$EXPECTED_SHA" in *[!0-9a-f]*) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline input and backfill checks
        run: python -B -m unittest tests.test_inoreader_content tests.test_inoreader_body_backfill
      - name: Temporary pinned PostgreSQL driver
        run: |
          python -m venv "$RUNNER_TEMP/bohun-inoreader-body"
          "$RUNNER_TEMP/bohun-inoreader-body/bin/python" -m pip install --only-binary=:all: 'psycopg[binary]==3.3.6'
      - name: Sync BOHUN folders with bounded provider body capture
        if: vars.INOREADER_SHARED_ENABLED != 'true'
        env:
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            "$RUNNER_TEMP/bohun-inoreader-body/bin/python" -B collectors/inoreader/sync.py --max-pages 1 --max-items 12 --backfill-bodies
          else
            "$RUNNER_TEMP/bohun-inoreader-body/bin/python" -B collectors/inoreader/sync.py --max-pages 2
          fi
      - name: Prepare shared coordinator config
        if: vars.INOREADER_SHARED_ENABLED == 'true'
        env:
          SOURCE_DISCOVERY_CONFIG: ${{ secrets.SOURCE_DISCOVERY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -B - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          try:
              root = Path(os.environ['RUNNER_TEMP']) / ('inoreader-shared-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              root.mkdir(mode=0o700)
              value = json.loads(os.environ['SOURCE_DISCOVERY_CONFIG'])
              if value['runtime'].get('oauth_mode') != 'coordinator' or value['runtime'].get('api_quota_mode') != 'shared':
                  raise ValueError('shared ownership must be explicit')
              value['runtime']['runtime_root'] = str(root)
              value['runtime']['state_path'] = str(root / 'sandbox' / 'service')
              value['policy_path'] = str(Path.cwd() / 'collectors/source_registry/discovery/policy.proposed.json')
              with (Path(os.environ['RUNNER_TEMP']) / 'inoreader-shared-config.json').open('x') as out:
                  os.chmod(out.name, 0o600)
                  json.dump(value, out)
          except BaseException:
              raise SystemExit('SHARED_CONFIG_HOLD') from None
          PYCONFIG
      - name: Sync BOHUN folders through the shared coordinator
        if: vars.INOREADER_SHARED_ENABLED == 'true'
        env:
          SOURCE_DISCOVERY_STATE_TOKEN: ${{ secrets.SOURCE_DISCOVERY_STATE_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          API_CAP=60
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then API_CAP=2; fi
          command=("$RUNNER_TEMP/bohun-inoreader-body/bin/python" -B -m collectors.inoreader.shared_runtime --config "$RUNNER_TEMP/inoreader-shared-config.json" --allow-live --max-api-attempts "$API_CAP" --)
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            "${command[@]}" --max-pages 1 --max-items 12 --backfill-bodies
          else
            "${command[@]}" --max-pages 2
          fi
      - name: Verify stored text hashes without logging content
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: '"$RUNNER_TEMP/bohun-inoreader-body/bin/python" -B scripts/inoreader-body-readback.py'
