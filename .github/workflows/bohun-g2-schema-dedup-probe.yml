name: BOHUN G2 Schema and Dedup Probe (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bohun-g2-schema-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect bounded JSON structures without exporting source records
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, socket, urllib.error, urllib.request

          SOURCES = [
              ("CDTI", "https://sede.cdti.gob.es/AreaPrivada/Servicios/DatosAbiertos/api/datos/proyectosidi/JSON/2026/ALL"),
              ("BORME", "https://www.boe.es/datosabiertos/api/borme/sumario/20240529"),
              ("ARES", "https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/00006947"),
          ]
          MAX_BYTES = 1048576
          MAX_DEPTH = 3
          MAX_KEYS = 35
          MAX_ITEMS = 3
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def shape(value, depth=0):
              if isinstance(value, dict):
                  result = {"type": "object", "field_count": len(value)}
                  if depth < MAX_DEPTH:
                      result["fields"] = {
                          key: shape(value[key], depth + 1)
                          for key in sorted(value)[:MAX_KEYS]
                      }
                      result["field_names_truncated"] = len(value) > MAX_KEYS
                  return result
              if isinstance(value, list):
                  result = {"type": "array", "length": len(value)}
                  if depth < MAX_DEPTH and value:
                      result["sample_element_shapes"] = [
                          shape(v, depth + 1) for v in value[:MAX_ITEMS]
                      ]
                  return result
              if value is None:
                  return {"type": "null"}
              if isinstance(value, bool):
                  return {"type": "boolean"}
              if isinstance(value, (int, float)):
                  return {"type": "number"}
              return {"type": "string"}

          # Keys are schema labels, not record values. Do not output any scalar values,
          # company names, identifiers, addresses, payload hashes, or raw response bodies.
          # To prevent unexpected source-supplied strings from being logged, report only
          # allowlisted field names and aggregate counts, not arbitrary JSON object keys.
          ALLOWED = {
              "CDTI": {"proyectos", "proyecto", "datos", "data", "resultado", "resultados",
                       "id", "codigo", "nif", "cif", "beneficiario", "beneficiarios",
                       "importe", "titulo", "fecha", "nombre", "razonSocial", "razon_social"},
              "BORME": {"data", "status", "sumario", "secciones", "seccion", "apartados",
                        "apartado", "items", "anuncios", "id", "identificador", "fecha",
                        "numero", "url", "pdf", "titulo", "actos"},
              "ARES": {"ico", "icoId", "dic", "obchodniJmeno", "sidlo", "pravniForma",
                       "pravniFormaRos", "czNace", "czNace2008", "datumAktualizace",
                       "primarniZdroj", "seznamRegistraci", "dalsiUdaje",
                       "adresaDorucovaci", "financniUrad", "subRegistrSzr"},
          }
          def safe_shape(value, source, depth=0):
              if isinstance(value, dict):
                  keys = sorted(k for k in value if isinstance(k, str) and k in ALLOWED[source])
                  result = {"type": "object", "field_count": len(value),
                            "recognized_field_names": keys[:MAX_KEYS],
                            "unrecognized_field_count": len(value) - len(keys)}
                  if depth < MAX_DEPTH:
                      result["recognized_fields"] = {
                          key: safe_shape(value[key], source, depth + 1)
                          for key in keys[:MAX_KEYS]
                      }
                  return result
              if isinstance(value, list):
                  result = {"type": "array", "length": len(value)}
                  if depth < MAX_DEPTH and value:
                      result["sample_element_shapes"] = [
                          safe_shape(v, source, depth + 1) for v in value[:MAX_ITEMS]
                      ]
                  return result
              return {"type": "null" if value is None else
                      "boolean" if isinstance(value, bool) else
                      "number" if isinstance(value, (int, float)) else "string"}

          report = {
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "policy": "one GET per source; no redirects/retries; max 1 MiB+1 read; no source values stored",
              "dedup_policy": {
                  "company": "country + identifier_type + normalized_identifier",
                  "project": "source + stable_project_identifier (if verified)",
                  "event": "source + stable_publication_identifier (if verified)",
                  "name_only_matches": "manual_review_only",
              },
              "sources": [],
          }
          opener = urllib.request.build_opener(NoRedirect)
          for name, url in SOURCES:
              item = {"source": name, "http_status": None, "content_type": None,
                      "declared_length": None, "sample_bytes": None,
                      "truncated": None, "schema": None, "error_type": None}
              request = urllib.request.Request(url, headers={
                  "User-Agent": "BOHUN-G2-Schema-Probe/0.1 (manual; one request per source)",
                  "Accept": "application/json",
                  "Range": "bytes=0-1048575",
              })
              try:
                  with opener.open(request, timeout=15) as response:
                      item["http_status"] = response.status
                      item["content_type"] = response.headers.get("Content-Type")
                      item["declared_length"] = response.headers.get("Content-Length")
                      payload = response.read(MAX_BYTES + 1)
                      item["sample_bytes"] = min(len(payload), MAX_BYTES)
                      item["truncated"] = len(payload) > MAX_BYTES
                      if not item["truncated"]:
                          try:
                              item["schema"] = safe_shape(json.loads(payload), name)
                          except (ValueError, UnicodeDecodeError):
                              item["error_type"] = "InvalidOrNonJSON"
                      else:
                          item["error_type"] = "ResponseTooLargeForSchemaProbe"
              except urllib.error.HTTPError as exc:
                  item["http_status"] = exc.code
                  item["error_type"] = "HTTPError"
                  exc.close()
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError) as exc:
                  item["error_type"] = type(exc).__name__
              report["sources"].append(item)
          pathlib.Path("g2-probe").mkdir(exist_ok=True)
          pathlib.Path("g2-probe/report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - name: Upload metadata-only schema report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bohun-g2-schema-dedup-metadata
          path: g2-probe/report.json
          retention-days: 7
          if-no-files-found: warn
