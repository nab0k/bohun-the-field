name: US Grants.gov Opportunities (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/opportunities-grants-us.yml
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * *'
permissions:
  contents: read
jobs:
  grants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query official Grants.gov search2 API
        run: python collectors/opportunities/grants_us.py --output output/grants-us
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-grants-opportunities
          path: output/grants-us.*
          retention-days: 30
          if-no-files-found: ignore
