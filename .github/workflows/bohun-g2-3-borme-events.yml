name: BOHUN G2.3 BORME Event Structure (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Analyze in memory and write metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, datetime, json, pathlib, re, socket, urllib.error, urllib.request
          LIMIT = 1048576
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def fetch(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "BOHUN-Bounded-Research/0.1"})
              with urllib.request.build_opener(NoRedirect).open(req, timeout=15) as res:
                  raw = res.read(LIMIT + 1)
                  if len(raw) > LIMIT:
                      raise ValueError("ResponseTooLarge")
                  return json.loads(raw)

          # Static schema keys only, no publication text or individual identifiers.
          FIELD = re.compile(r"^[A-Za-z_][A-Za-z0-9_]{0,63}$")
          def shape(v, depth=0):
              if isinstance(v, dict):
                  keys = sorted(k for k in v if isinstance(k, str) and FIELD.fullmatch(k))
                  out = {"type": "object", "field_count": len(v), "field_names": keys[:50],
                         "suppressed_key_count": len(v) - min(len(keys), 50)}
                  if depth < 9:
                      out["fields"] = {k: shape(v[k], depth+1) for k in keys[:50]}
                  return out
              if isinstance(v, list):
                  out = {"type": "array", "length": len(v)}
                  if depth < 9:
                      out["element_shapes"] = [shape(x, depth+1) for x in v[:2]]
                  return out
              return {"type": "null" if v is None else "boolean" if isinstance(v, bool) else "number" if isinstance(v, (int, float)) else "string"}
          try:
              doc = fetch("https://www.boe.es/datosabiertos/api/borme/sumario/20240529")
              summary = doc["data"]["sumario"]
              sections = [s for d in summary.get("diario", []) if isinstance(d, dict)
                          for s in d.get("seccion", []) if isinstance(s, dict)]
              report = {"source": "BORME", "diario_count": len(summary.get("diario", [])),
                        "section_count": len(sections),
                        "section_item_types": dict(collections.Counter(type(s.get("item")).__name__ for s in sections)),
                        "schema": shape(doc),
                        "notes": ["first two array elements only; schema is sampled",
                                  "document identifiers are not proven event identifiers",
                                  "no record values or identifiers exported"]}
          except (ValueError, TypeError, KeyError, urllib.error.URLError, TimeoutError, socket.timeout, OSError) as exc:
              report = {"source": "BORME", "error_type": type(exc).__name__}
          pathlib.Path("g2-3").mkdir(exist_ok=True)
          pathlib.Path("g2-3/report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload schema only
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bohun-g2-3-borme-event-schema
          path: g2-3/report.json
          retention-days: 7
          if-no-files-found: warn
