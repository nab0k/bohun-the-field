name: D2RC retry policy offline checks
on:
  pull_request:
    branches: [codex/d2rc-cloud-probe]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests/kb_pilot -t .
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
          sh scripts/check_d2rc_retry_policy.sh
