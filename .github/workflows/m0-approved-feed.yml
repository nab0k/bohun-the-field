name: M0 approved intelligence feed checks
on:
  pull_request:
    paths:
      - 'src/atlas/approved-feed.js'
      - 'src/atlas/main.js'
      - 'tests/test-approved-feed.mjs'
      - '.github/workflows/m0-approved-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node tests/test-approved-feed.mjs
      - run: npm test
      - run: npm run build:site
