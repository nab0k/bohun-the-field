# M0 GitHub Pages candidate only; main branch's workflow remains unchanged.
# Requires Pages Settings -> Build and deployment -> GitHub Actions and custom domain verification.
name: Deploy site
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type RELEASE_M0_AFTER_BACKUP to deploy GitHub Pages'
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == 'm0-public-release-review' && inputs.release_confirmation == 'RELEASE_M0_AFTER_BACKUP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m0-public-release-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-m0-gate.mjs
      - run: npm run build:site
        env:
          SITE_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
