name: BOHUN daily syntheses (EXP-028, autonomous)
# D-20261030-DAILY-CHAIN: twice a day, new items -> embeddings -> pilot (CANDIDATEs held) -> automatic admission ->
# relation extraction on the free quota left. The contract check stops the chain before any write when a column the
# chain reads is gone; then the feed simply stays as it is. Adding sources or companies does not touch the chain.
on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      verify_fulltext_cohort:
        description: 'One private fulltext-before-embedding cohort (at most 12); manual review remains required'
        type: boolean
        default: false
        required: false
      resume_stored_cohort:
        description: 'Resume only the 10 stored items from run41439209286, without publisher HTTP'
        type: boolean
        default: false
        required: false
      expected_sha:
        description: 'Exact reviewed SHA required for stored cohort resume'
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: bohun-kb-pilot
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'nab0k/bohun-the-field' && (github.event_name == 'schedule' || github.actor == 'nab0k')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      KB_RESEARCH_THINKING: low
      KB_CAP_MICRO_USD: '500000'   # $0.50 per run for the paid steps (two runs a day)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Offline pilot tests
        run: python -B -m unittest discover -s tests/kb_pilot -t .
      - name: Temporary pinned PostgreSQL driver
        run: |
          python -m venv "$RUNNER_TEMP/bohun-kb"
          "$RUNNER_TEMP/bohun-kb/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check 'psycopg[binary]==3.3.6'
          mkdir -p "$RUNNER_TEMP/kb-daily"
          echo "DAY_FROM=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"
          echo "DAY_TO=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Validate exclusive manual verification inputs
        if: github.event_name == 'workflow_dispatch' && (inputs.verify_fulltext_cohort == true || inputs.resume_stored_cohort == true)
        env:
          CAPTURE: ${{ inputs.verify_fulltext_cohort }}
          RESUME: ${{ inputs.resume_stored_cohort }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python -B - <<'PYTHON'
          import os
          capture = os.environ['CAPTURE'] == 'true'
          resume = os.environ['RESUME'] == 'true'
          if capture == resume or (resume and os.environ['EXPECTED_SHA'] != os.environ['GITHUB_SHA']):
              raise SystemExit('A11_INPUT_SCOPE_INVALID')
          PYTHON
      - name: Contract check (stops the chain before any write)
        env:
          KB_MODE: contract
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot | tee "$RUNNER_TEMP/kb-daily/contract.log"'
      - name: One manual fulltext cohort (private, before embedding)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_fulltext_cohort == true
        env:
          A11_MANUAL_COHORT: 'true'
        run: |
          "$RUNNER_TEMP/bohun-kb/bin/python" -m pip install --disable-pip-version-check 'trafilatura==2.3.1'
          "$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot.cohort_daily --apply
      - name: Resume the exact stored cohort (no publisher HTTP)
        if: github.event_name == 'workflow_dispatch' && inputs.resume_stored_cohort == true
        env:
          A11_MANUAL_RESUME: 'true'
          A11_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot.cohort_daily --apply --resume-stored'
      - name: Embeddings of new items (Cloudflare; without them search falls back to words)
        if: github.event_name != 'workflow_dispatch' || (inputs.verify_fulltext_cohort != true && inputs.resume_stored_cohort != true)
        continue-on-error: true
        env:
          KB_MODE: embed
          KB_EMBED_BACKEND: cloudflare
          LIMIT: '400'
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot | tee "$RUNNER_TEMP/kb-daily/embed.log"'
      - name: Pilot on new items, CANDIDATEs held for admission
        id: pilot
        if: github.event_name != 'workflow_dispatch' || (inputs.verify_fulltext_cohort != true && inputs.resume_stored_cohort != true)
        shell: bash
        env:
          KB_MODE: pilot-publish
        run: |
          umask 077
          audit_args=()
          if mkdir -m 700 "$RUNNER_TEMP/kb-input-audit" && echo "audit_requested=true" >> "$GITHUB_OUTPUT"; then
            audit_args=(--input-audit "$RUNNER_TEMP/kb-input-audit/report.json")
          else
            echo "::warning::Input audit directory unavailable"
          fi
          "$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot --day-from "$DAY_FROM" --day-to "$DAY_TO" --limit 80 --source items --new-only --publish-hold --batch --out "$RUNNER_TEMP/kb-daily/pilot" "${audit_args[@]}" | tee "$RUNNER_TEMP/kb-daily/pilot.log"
      - name: Encrypt the input audit
        id: input_audit
        if: "!cancelled() && steps.pilot.outputs.audit_requested == 'true' && (steps.pilot.outcome == 'success' || steps.pilot.outcome == 'failure')"
        shell: bash
        env:
          AUDIT_CERT_PEM: ${{ vars.KB_INPUT_AUDIT_CERT_PEM }}
          AUDIT_CERT_SHA256: ${{ vars.KB_INPUT_AUDIT_CERT_SHA256 }}
        run: |
          umask 077
          audit="$RUNNER_TEMP/kb-input-audit"
          if [[ ! -f "$audit/report.json" ]]; then
            echo "::warning::Input audit unavailable"
            exit 0
          fi
          trap 'rm -f "$audit/report.json" "$audit/recipient.pem" "$audit/report.partial"' EXIT
          printf '%s\n' "$AUDIT_CERT_PEM" > "$audit/recipient.pem"
          if ! openssl x509 -in "$audit/recipient.pem" -checkend 300 -noout >/dev/null 2>&1 ||
             ! fingerprint=$(openssl x509 -in "$audit/recipient.pem" -outform DER | sha256sum) ||
             [[ "${fingerprint%% *}" != "$AUDIT_CERT_SHA256" ]] ||
             ! openssl cms -encrypt -binary -aes-256-gcm -in "$audit/report.json" -outform DER -out "$audit/report.partial" "$audit/recipient.pem"; then
            echo "::warning::Input audit encryption failed"
            exit 0
          fi
          mv "$audit/report.partial" "$audit/report.der"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"
      - name: Upload the encrypted input audit
        id: input_audit_upload
        if: "!cancelled() && steps.input_audit.outputs.encrypted == 'true'"
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kb-daily-input-audit-encrypted
          path: ${{ runner.temp }}/kb-input-audit/report.der
          retention-days: 1
          if-no-files-found: error
      - name: Automatic admission (checks, second model, self-correction)
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || (inputs.verify_fulltext_cohort != true && inputs.resume_stored_cohort != true))"
        continue-on-error: true
        env:
          KB_MODE: admit
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot --limit 30 | tee "$RUNNER_TEMP/kb-daily/admit.log"'
      - name: Relation extraction on the free quota left
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || (inputs.verify_fulltext_cohort != true && inputs.resume_stored_cohort != true))"
        continue-on-error: true
        env:
          KB_MODE: extract
        run: '"$RUNNER_TEMP/bohun-kb/bin/python" -B -m collectors.kb_pilot --day-from "$DAY_FROM" --day-to "$DAY_TO" --limit 120 | tee "$RUNNER_TEMP/kb-daily/extract.log"'
      - name: Refresh the site feed now
        # GitHub thins scheduled runs of the site's feed job, so new materials could wait for hours.
        # A narrow token (Actions on nab0k/bohundefense only). Without it the step skips and the schedule still works.
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_FEED_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SITE_FEED_DISPATCH_TOKEN not set; waiting for the site schedule"; exit 0; fi
          gh workflow run automatic-synthesis-feed.yml -R nab0k/bohundefense --ref main
      - name: Freshness of the public feed (warns, never stops the run)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/check_synthesis_freshness.py --max-hours 30
      - name: Summary
        if: always()
        env:
          INPUT_AUDIT_UPLOAD_OUTCOME: ${{ steps.input_audit_upload.outcome }}
        run: |
          {
            echo "### BOHUN daily syntheses $DAY_FROM..$DAY_TO"
            for f in contract embed pilot admit extract; do
              echo "- **$f**: \`$(grep -ho 'KB_[A-Z_]* .*' "$RUNNER_TEMP/kb-daily/$f.log" 2>/dev/null | tail -1 | cut -c1-600)\`"
            done
            if [[ -f "$RUNNER_TEMP/kb-daily/pilot.log" ]]; then
              grep -E '^KB_INPUT_AUDIT ' "$RUNNER_TEMP/kb-daily/pilot.log" || true
              echo "- Encrypted input audit: ${INPUT_AUDIT_UPLOAD_OUTCOME:-unavailable}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the result for review
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kb-daily-result
          path: ${{ runner.temp }}/kb-daily
          retention-days: 14
          if-no-files-found: warn
