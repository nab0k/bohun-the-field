name: Source Hunter 1000 (20 minutes)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target unique validated feeds"
        required: false
        default: "1000"
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests feedparser beautifulsoup4 lxml
      - name: Discover public feeds (no production writes)
        run: python tools/source_hunter_1000.py --minutes 18 --target "${{ inputs.target }}" --workers 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bohun-source-hunter-results
          path: output/source-hunter/
          retention-days: 30
