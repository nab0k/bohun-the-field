name: BOHUN G1 API Probe (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bohun-g1-probe-manual
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Three bounded official API requests (metadata only)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.request, urllib.error, socket
          from xml.etree import ElementTree as ET

          targets = {
              "CDTI": "https://sede.cdti.gob.es/AreaPrivada/Servicios/DatosAbiertos/api/datos/proyectosidi/JSON/2026/ALL",
              "BORME": "https://www.boe.es/datosabiertos/api/borme/sumario/20240529",
              "ARES": "https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/00006947",
          }
          MAX_BYTES = 131072
          output = {"run_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    "scope": "three requests, max 128 KiB per response, no retries, no redirects followed",
                    "sources": []}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for name, url in targets.items():
              record = {"source": name, "endpoint": url, "http_status": None,
                        "content_type": None, "content_length_header": None,
                        "sample_bytes": 0, "sample_sha256": None,
                        "truncated": None, "structure": None, "error": None}
              req = urllib.request.Request(url, headers={
                  "User-Agent": "BOHUN-G1-Research-Probe/0.1 (manual; 1 request/source)",
                  "Accept": "application/json, application/xml, text/xml;q=0.9, */*;q=0.1",
                  "Range": "bytes=0-131071",
              })
              try:
                  with opener.open(req, timeout=15) as response:
                      record["http_status"] = response.status
                      record["content_type"] = response.headers.get("Content-Type")
                      record["content_length_header"] = response.headers.get("Content-Length")
                      sample = response.read(MAX_BYTES + 1)
                      record["truncated"] = len(sample) > MAX_BYTES
                      sample = sample[:MAX_BYTES]
                      record["sample_bytes"] = len(sample)
                      record["sample_sha256"] = hashlib.sha256(sample).hexdigest()
                      # Parse only if complete; no records or identifiers leave the runner.
                      if not record["truncated"]:
                          try:
                              obj = json.loads(sample)
                              record["structure"] = {"format": "JSON", "root_type": type(obj).__name__,
                                  "top_level_keys": sorted(obj.keys())[:30] if isinstance(obj, dict) else None,
                                  "array_length": len(obj) if isinstance(obj, list) else None}
                          except (ValueError, UnicodeDecodeError):
                              try:
                                  root = ET.fromstring(sample)
                                  record["structure"] = {"format": "XML", "root_tag": root.tag.split("}")[-1],
                                      "direct_children": len(root)}
                              except ET.ParseError:
                                  record["structure"] = {"format": "unparsed_or_partial"}
                      else:
                          record["structure"] = {"format": "partial; cannot infer schema or deduplication"}
              except urllib.error.HTTPError as exc:
                  record["http_status"] = exc.code
                  record["content_type"] = exc.headers.get("Content-Type")
                  record["error"] = "HTTP error (body not downloaded)"
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError) as exc:
                  record["error"] = type(exc).__name__
              output["sources"].append(record)
          pathlib.Path("g1-probe").mkdir(exist_ok=True)
          pathlib.Path("g1-probe/report.json").write_text(json.dumps(output, ensure_ascii=False, indent=2))
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
      - name: Upload metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bohun-g1-probe-metadata
          path: g1-probe/report.json
          if-no-files-found: warn
          retention-days: 7
