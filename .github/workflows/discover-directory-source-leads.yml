name: Discover 500+ directory source leads (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-directory-source-leads.yml
  workflow_dispatch:
  schedule:
    - cron: '50 5 * * 0'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline extractor tests
        run: python -m unittest discover -s tests -p 'test_namc_directory.py'
      - name: Extract candidate websites from official NAMC public directory
        run: |
          mkdir -p output
          python collectors/source_registry/namc_directory.py \
            --pages 60 --minimum 450 --output output/directory-source-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-source-leads
          path: output/directory-source-candidates.*
          retention-days: 30
          if-no-files-found: ignore
