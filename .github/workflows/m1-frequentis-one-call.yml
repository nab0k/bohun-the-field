name: M1 Frequentis Gemini Test (manual, no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frequentis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned reviewed candidate
        uses: actions/checkout@v4
        with:
          ref: fc3b5e5489fa3af564fed666c15563c650a2d990
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction
        run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - name: Generate ONE internal Frequentis candidate with Gemini 3.5 Flash Lite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/m1_frequentis_gemini.py
      - name: Upload QA-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frequentis-gemini-review-only
          path: output/gemini-frequentis/
          retention-days: 3
          if-no-files-found: warn
