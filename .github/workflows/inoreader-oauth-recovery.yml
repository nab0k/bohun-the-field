name: Inoreader OAuth Secret Recovery (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inoreader-oauth-rotation
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: inoreader-oauth-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight required secrets without revealing values
        env:
          ADMIN: ${{ secrets.INOREADER_SECRET_ADMIN_TOKEN }}
          CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          REFRESH: ${{ secrets.INOREADER_REFRESH_TOKEN }}
        run: |
          test -n "$ADMIN" && test -n "$CLIENT_ID" && test -n "$CLIENT_SECRET" && test -n "$REFRESH" || { echo "Required OAuth recovery secret missing"; exit 1; }
      - name: Install sealed-box encryption library
        run: python -m pip install 'PyNaCl==1.5.0'
      - name: Exchange once and persist rotated token securely
        env:
          INOREADER_SECRET_ADMIN_TOKEN: ${{ secrets.INOREADER_SECRET_ADMIN_TOKEN }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
        run: python scripts/inoreader-rotate-github-secret.py
