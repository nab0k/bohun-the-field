name: EU Funding API smoke (manual, read-only)
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline request encoding tests
        run: python -m unittest discover -s tests -p 'test_eu_funding_api_smoke.py' -v
      - name: Offline result inspection tests
        run: python -m unittest discover -s tests -p 'test_edf_results_inspection.py' -v
      - name: Offline nested metadata tests
        run: python -m unittest discover -s tests -p 'test_edf_nested_metadata.py' -v
      - name: Offline EDF normalizer tests
        run: python -m unittest discover -s tests -p 'test_eu_edf_normalizer.py' -v
      - name: Probe official EDF funding endpoint (no writes)
        run: python collectors/opportunities/eu_funding_api_smoke.py --limit 3 --timeout 20
