name: Candidate Extraction v3 (offline tests)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/candidate_extraction_v3.py'
      - 'tests/test_candidate_extraction_v3.py'
      - '.github/workflows/candidate-extraction-v3.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_candidate_extraction_v3.py' -v
